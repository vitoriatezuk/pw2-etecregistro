<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora com JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora-container">
        <h1>Calculadora</h1>
        
        <!-- Campos de entrada -->
        <div class="input-group">
            <input type="number" name="n1" id="n1" placeholder="Número 1" min="0" max="99">
            <input type="number" name="n2" id="n2" placeholder="Número 2" min="0" max="99">
        </div>

        <!-- Botões de ação -->
        <div class="button-group">
            <input type="button" value="Somar" onclick="somar()">
            <input type="button" value="Subtrair" onclick="subtrair()">
            <input type="button" value="Multiplicar" onclick="multiplicar()">
            <input type="button" value="Dividir" onclick="dividir()">
            <input type="button" value="Limpar" class="btn-clear" onclick="limpar()">
        </div>

        <!-- Área de resultado -->
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
