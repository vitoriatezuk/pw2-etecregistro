6. Manipulação do DOM (Document Object Model)
Árvore DOM: Representação hierárquica da página Web no navegador.

Parent (pai): Elemento ancestral direto na árvore.

Child (filho): Elemento contido dentro de outro.

Siblings (irmãos): Elementos do mesmo nível hierárquico sob o mesmo elemento pai.

Estrutura básica: window ➔ document ➔ html ➔ (head, body).

Métodos de Seleção de Elementos do DOM (5 modos):

Por Tag: getElementsByTagName()

Por ID: getElementById()

Por Nome: getElementsByName()

Por Classe: getElementsByClassName()

Por Seletor CSS: querySelector() e querySelectorAll()

7. Eventos em JavaScript
Conceito: Ações realizadas em elementos da página (textos, imagens, divs) decorrentes da interação do utilizador ou do sistema.

Principais Eventos:

Rato/Mouse: click, mouseenter, mousemove, mousedown, mouseout, mouseup.

Teclado e Formulário: focus, keypress.

Carregamento: load.

8. Funções em JavaScript
Conceito: Blocos de código que só são executados quando explicitamente solicitados/chamados (por exemplo, ao disparar um evento).

Estrutura:

JavaScript
function nomeDaAcao(parametro) {
    // Bloco de código a executar
}
Nome da Função: Ligado à ação que vai executar (existem também funções anónimas, mas atribuir nome ajuda na chamada e organização).

Parâmetros: Valores opcionais passados para dentro da função que serão utilizados durante a sua execução.
