2. Regras para Identificadores (Nomes de Variáveis)
Início do Nome: Pode começar com letras, $ ou _. Nunca pode começar com números.   
PDF
+ 1

Caracteres Permitidos: Aceita letras, números e acentos, mas não pode conter espaços.   
PDF

Sensibilidade: É case-sensitive (diferencia letras maiúsculas de minúsculas).   
PDF

Padrão de Escrita: Recomenda-se o uso de camelCase para palavras compostas.   
PDF

Restrições: Não pode utilizar palavras reservadas da linguagem (ex.: var, function, alert).   
PDF

3. Declaração de Variáveis (var, let, const)
var: O seu valor pode ser reatribuído e permite ser redeclarada.   
PDF

let: O seu valor pode ser reatribuído, mas não permite redeclaração.   
PDF

const: Não permite reatribuição de valor nem redeclaração.   
PDF

4. Tipos de Dados e Operador typeof
Tipos de Dados: number (incluindo Infinity e NaN), string, boolean, null, undefined, object (incluindo Array), e function.   
PDF

NaN (Not a Number): Ocorre quando se tenta realizar operações matemáticas com tipos incompatíveis (ex.: multiplicar um número por uma string).   
PDF

Operador typeof: Retorna o tipo de dado de uma variável (ex.: typeof n devolve 'number').   
PDF

5. Manipulação e Formatação de Strings
Concatenação Tradicional: Utiliza o operador +.   
PDF

Template Strings: Utilizam crases (`) e a sintaxe ${variavel} para intercalar valores e variáveis.   
PDF

Propriedades e Métodos de String:

s.length: Devolve a quantidade de caracteres.   
PDF

s.toUpperCase(): Converte o texto para letras maiúsculas.   
PDF

s.toLowerCase(): Converte o texto para letras minúsculas.

Entrada de Dados (window.prompt): Por padrão, qualquer dado recebido via window.prompt() é do tipo string. Somar duas strings sem converter resulta em concatenação (ex.: "4" + "2" resulta em "42").

Number.parseInt(n): Converte para número inteiro.
