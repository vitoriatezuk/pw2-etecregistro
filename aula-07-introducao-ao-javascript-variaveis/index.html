<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introdução ao Javascript</title>
  </head>
  <body>
    <h1>Introdução ao Javascript</h1>
    <p>Eu sou...</p>
  </body>
  <!-- JAVASCRIPT INTERNO -->
  <script>
    //Aqui ira o codigo javascript
    //Comentario em linha
    /*Comentario em bloco */

    // DECLARANDO VARIAVEIS

    var nome = "Anna";
    document.write(nome);
    document.write("<br>");
    nome = "João";
    document.write(nome);

    //LET 
    
    let cidade = "Registro";
    // let cidade = "Pariquera"; // ERRO, não pode declarar a mesma variavel com let'
    cidade = "Pariquera";
    document.write("<br>");
    document.write("Eu moro em " + cidade);

    //CONST -> constante, não pode ser alterada
    const idade="16";
    // idade = "17"; 
    document.write("<br>");
    document.write("Tenho " + idade + " anos!");

 
  </script>
</html>
