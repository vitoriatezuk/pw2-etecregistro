<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introdução ao Javascript</title>
  </head>
  <body>
    <h1>Introdução ao Javascript</h1>
    <p>Eu sou...</p>
  </body>
  <!-- JAVASCRIPT INTERNO -->
  <script>
    //Aqui ira o codigo javascript
    //Comentario em linha
    /*Comentario em bloco */

    // DECLARANDO VARIAVEIS

   // var nome = "Anna";
   // document.write(nome);
    //document.write("<br>");
    //SOLIOCITANDO DADOS DO USUARIO
    var nome = window.prompt("Digite seu nome: ");
    document.write(nome);

    //LET

    let cidade = window.prompt("Digite sua cidade: ");
    // let cidade = "Pariquera"; // ERRO, não pode declarar a mesma variavel com let'
    //cidade = "Pariquera";
    document.write('<br>');
    document.write("Eu moro em " + cidade + ' <br>' );

    //CONST -> constante, não pode ser alterada
    const idade = Number(window.prompt("Digite sua idade: "));
    // idade = "17";
    document.write("Tenho " + idade + " anos! <br>");

    //VERIFICANDO OS TIPOS DAS VARIAVEIS
    document.write("O tipo da variavel nome é: " + typeof nome);
    document.write("<br> O tipo da variavel idade é: " + typeof idade);
    //O JAVASCRIPT ATRIBUI OS TIPOS ÀS VARIÁVEIS DE FORMA DINÂMICA

    //Exibindo uma mensagem de alerta ao usuário
    window.alert(`Bem-vindo ${nome}!`);

    //SOLICITANDO AO USUARIO DOIS NUMEROS 
    const n1 = Number(window.prompt("Digite um numero: "));
    const n2 = Number(window.prompt("Digite outro numero: "));
    const soma = n1 + n2;
    document.write(`A resultado da soma de ${n1} + ${n2} é: ${soma}`);

    //FROMATANDO STRINGS 
    document.write(`<br> O seu nome em letras maiusculas é: ${nome.toUpperCase()}`);
    document.write(`<br> O seu nome em letras minusculas é: ${nome.toLowerCase()}`);
    
    //FORMATAÇÃO DE NÚMEROS 
    const salario = 25000;
    document.write(`<br>Salário com casas decimais: ${salario.toFixed(2)}`)
    document.write(`<br>Salário com casa decimal em vírgula: ${salario.toFixed(2).replace('.', ',')}`);

    //FORMATAÇÃO DE MOEDA 
    document.write(`<br> Salário em real: ${salario.toLocalString(`pt-br`, {style:`currency`, currency: `BRL`})}`)

    //DOLAR
    document.write(`<br> Salário em dólar: ${salario.toLocalString(`pt-br`, {style:`currency`, currency: `USD`})}`)
    

  </script>
</html>
